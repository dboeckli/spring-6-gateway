info:
  name: 2) update the beer (PUT, uses {{beerId}})
  type: http
  seq: 2

http:
  method: PUT
  url: http://localhost:{{gateway-port}}/api/v4/beer/{{beerId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=spring-6-data-rest
  body:
    type: json
    data: |-
      {
          "beerName": "Blessed Changed",
          "beerStyle": "STOUT",
          "upc": "4666337557578",
          "quantityOnHand": 2877,
          "price": 51.10
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
            let result = '';
            const chars = '0123456789abcdef';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }
        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));

        const beerId = bru.getVar("beerId");
        console.log("updateBeer -> beerId=" + beerId);
        if (!beerId) {
            throw new Error("beerId is not set - run 'list beers' first");
        }
    - type: tests
      code: |-
        test("updateBeer returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("updated beer name matches", function () {
            expect(res.body.beerName === "Blessed Changed", "beerName mismatch").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

