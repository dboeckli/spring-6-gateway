  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("discovery returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("discovery exposes a token endpoint", function () {
            expect(!!res.body.token_endpoint, "token_endpoint missing").to.be.true;
        });
        test("discovery exposes an issuer", function () {
            expect(!!res.body.issuer, "issuer missing").to.be.true;
        });

