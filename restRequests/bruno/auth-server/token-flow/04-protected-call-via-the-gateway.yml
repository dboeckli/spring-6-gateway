info:
  name: 4) protected call via the gateway (uses {{accessToken}})
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:{{gateway-port}}/api/v1/beer/listBeers
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const accessToken = bru.getVar("accessToken");
        console.log("protected call -> accessToken set: " + (!!accessToken));
        if (!accessToken) {
            throw new Error("accessToken is not set - run 'get an access token' first");
        }
    - type: tests
      code: |-
        test("protected call returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("protected call returns a page", function () {
            expect(!!(res.body.content), "content missing").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

