info:
  name: 1) get an access token via the gateway (sets {{accessToken}})
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{gateway-port}}/oauth2/token
  headers:
    - name: Authorization
      value: Basic bWVzc2FnaW5nLWNsaWVudDpzZWNyZXQ=
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: text
    data: grant_type=client_credentials&scope=message.read%20message.write
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        bru.setVar("accessToken", res.body.access_token);
        console.log("token -> accessToken set: " + (!!res.body.access_token));
        test("token returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("token returns an access_token", function () {
            expect(!!res.body.access_token, "access_token missing").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Flow: token -> discovery -> actuator -> protected call — see restRequests/auth-server/token-flow/token-flow.md

  Source: auth-server/token-flow/token-flow.http
