info:
  name: 2) create a dedicated beer for the delete flow (sets {{beerId}})
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:{{gateway-port}}/api/v1/beer/createBeer
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=spring-6-rest-mvc
  body:
    type: json
    data: |-
      {
        "version": 0,
        "beerName": "delete-flow-beer",
        "beerStyle": "LAGER",
        "upc": "delete-flow",
        "quantityOnHand": 1,
        "price": 1.00
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        bru.setVar("beerId", res.body.id);
        console.log("Created beer id: " + res.body.id);

        test("createBeer returns 201", function () {
            expect(res.status === 201, "expected 201 but got " + res.status).to.be.true;
        });
        test("createBeer returns id", function () {
            expect(!!res.body.id, "beerId missing").to.be.true;
        });

