info:
  name: 3) delete the beer (uses {{beerId}})
  type: http
  seq: 3

http:
  method: DELETE
  url: http://localhost:{{gateway-port}}/api/v3/beer/{{beerId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=spring-6-reactive-mongo
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
            let result = '';
            const chars = '0123456789abcdef';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }
        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));

        const beerId = bru.getVar("beerId");
        console.log("deleteBeer -> beerId=" + beerId);
        if (!beerId) {
            throw new Error("beerId is not set - run 'list beers' first");
        }
    - type: tests
      code: |-
        test("deleteBeer returns 204", function () {
            expect(res.status === 204, "expected 204 but got " + res.status).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

