http:
  method: PUT
  url: http://localhost:{{gateway-port}}/api/v3/customer/{{customerId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=spring-6-reactive-mongo
  body:
    type: json
    data: |-
      {
          "customerName": "Changed Customer"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
            let result = '';
            const chars = '0123456789abcdef';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }
        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));

        const customerId = bru.getVar("customerId");
        console.log("updateCustomer -> customerId=" + customerId);
        if (!customerId) {
            throw new Error("customerId is not set - run 'list customers' first");
        }
    - type: tests
      code: |-
        test("updateCustomer returns 204", function () {
            expect(res.status === 204, "expected 204 but got " + res.status).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

