      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=spring-6-reactive
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
            let result = '';
            const chars = '0123456789abcdef';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }
        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));

        const customerId = bru.getVar("customerId");
        console.log("getCustomerById -> customerId=" + customerId);
        if (!customerId) {
            throw new Error("customerId is not set - run 'list customers' first");
        }
    - type: tests
      code: |-
        test("getCustomerById returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("customerName was patched", function () {
            expect(res.body.customerName === "Patched Customer", "customerName mismatch").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

