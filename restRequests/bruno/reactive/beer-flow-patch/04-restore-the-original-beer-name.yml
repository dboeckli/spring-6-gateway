info:
  name: 4) restore the original beer name (PATCH)
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:{{gateway-port}}/api/v2/beer/{{beerId}}
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=spring-6-reactive
  body:
    type: json
    data: |-
      {
          "beerName": "{{originalBeerName}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
            let result = '';
            const chars = '0123456789abcdef';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }
        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));

        const beerId = bru.getVar("beerId");
        const originalBeerName = bru.getVar("originalBeerName");
        bru.setVar("originalBeerName", originalBeerName);
        console.log("restoreBeer -> beerId=" + beerId + ", beerName=" + originalBeerName);
        if (!beerId || !originalBeerName) {
            throw new Error("beerId/originalBeerName is not set - run 'list beers' first");
        }
    - type: tests
      code: |-
        test("restoreBeer returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

