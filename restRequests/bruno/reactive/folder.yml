info:
  name: Untitled Folder
  type: folder

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{tokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: message.read message.write
    tokenConfig:
      id: auth-id
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

docs:
  content: |-
    OAuth2 client credentials (auth ID: auth-id).
    Generated by tools/http-to-bru.mjs
  type: text/markdown
