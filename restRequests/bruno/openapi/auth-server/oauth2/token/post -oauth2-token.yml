info:
  name: post /oauth2/token
  type: http
  seq: 1
  tags:
    - authorization-server-endpoints

http:
  method: POST
  url: "http://localhost:{{gateway-port}}/oauth2/token"
  headers:
    - name: Authorization
      value: ""
      disabled: true
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: ""
      - name: code
        value: ""
      - name: redirect_uri
        value: ""
      - name: refresh_token
        value: ""
      - name: scope
        value: ""
      - name: client_id
        value: ""
      - name: client_secret
        value: ""
      - name: client_assertion_type
        value: ""
      - name: client_assertion
        value: ""
      - name: additionalParameters
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

