info:
  name: post /oauth2/authorize
  type: http
  seq: 1
  tags:
    - authorization-server-endpoints

http:
  method: POST
  url: "http://localhost:{{gateway-port}}/oauth2/authorize"
  params:
    - name: parameters
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 302 Response
    description: Found
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/authorize"
      method: POST
      params:
        - name: parameters
          value: ""
          type: query
          disabled: true
    response:
      status: 302
      statusText: Found
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Bad Request
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/authorize"
      method: POST
      params:
        - name: parameters
          value: ""
          type: query
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "errorCode": "",
            "description": "",
            "uri": ""
          }
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/authorize"
      method: POST
      params:
        - name: parameters
          value: ""
          type: query
          disabled: true
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
