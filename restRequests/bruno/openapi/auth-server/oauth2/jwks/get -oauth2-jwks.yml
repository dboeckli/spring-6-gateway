info:
  name: get /oauth2/jwks
  type: http
  seq: 1
  tags:
    - authorization-server-endpoints

http:
  method: GET
  url: "http://localhost:{{gateway-port}}/oauth2/jwks"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/jwks"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "keys": [
              {}
            ]
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/jwks"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "errorCode": "",
            "description": "",
            "uri": ""
          }
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/jwks"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
