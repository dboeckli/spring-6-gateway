info:
  name: post /oauth2/revoke
  type: http
  seq: 1
  tags:
    - authorization-server-endpoints

http:
  method: POST
  url: "http://localhost:{{gateway-port}}/oauth2/revoke"
  body:
    type: form-urlencoded
    data:
      - name: token
        value: ""
      - name: token_type_hint
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
