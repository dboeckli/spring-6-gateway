    description: OK
    request:
      url: "http://localhost:{{gateway-port}}/oauth2/revoke"
      method: POST
      body:
        type: form-urlencoded
        data:
          - name: token
            value: ""
          - name: token_type_hint
            value: ""
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Bad Request
