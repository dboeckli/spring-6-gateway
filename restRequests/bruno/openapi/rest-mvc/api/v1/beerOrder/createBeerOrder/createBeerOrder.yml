info:
  name: createBeerOrder
  type: http
  seq: 1
  tags:
    - beer-order-controller

http:
  method: POST
  url: "http://localhost:{{gateway-port}}/api/v1/beerOrder/createBeerOrder"
  body:
    type: json
    data: |-
      {
        "customerRef": "",
        "customerId": "",
        "beerOrderLines": [
          {
            "beerId": "",
            "orderQuantity": 0
          }
        ]
      }
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: http://localhost:8080/oauth2/token
    refreshTokenUrl: http://localhost:8080/oauth2/refresh-token
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: message.read message.write
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
