info:
  name: rest-mvc
  type: folder

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{tokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: message.read message.write
    tokenConfig:
      id: auth-id
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false

docs:
  content: |-
    Generated from the rest-mvc OpenAPI spec
    (`target/openapi/openapi-spring-6-rest-mvc.json`, Maven classifier
    `openapi-rest-mvc`) with `bru import openapi --group-by path`.
    `{{baseUrl}}` is rewritten to `http://localhost:{{gateway-port}}`.
    Do not edit these files by hand; regenerate instead.
  type: text/markdown
