info:
  name: updateCustomer
  type: http
  seq: 2
  tags:
    - customer-controller

http:
  method: PUT
  url: "http://localhost:{{gateway-port}}/api/v2/customer/:customerId"
  params:
    - name: customerId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "id": 0,
        "customerName": "",
        "createdDate": "",
        "lastModifiedDate": ""
      }
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: http://localhost:8080/oauth2/token
    refreshTokenUrl: http://localhost:8080/oauth2/refresh-token
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: message.read message.write
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "http://localhost:{{gateway-port}}/api/v2/customer/:customerId"
      method: PUT
      params:
        - name: customerId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "id": 0,
            "customerName": "",
            "createdDate": "",
            "lastModifiedDate": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
