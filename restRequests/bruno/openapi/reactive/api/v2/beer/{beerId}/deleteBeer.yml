info:
  name: deleteBeer
  type: http
  seq: 3
  tags:
    - beer-controller

http:
  method: DELETE
  url: "http://localhost:{{gateway-port}}/api/v2/beer/:beerId"
  params:
    - name: beerId
      value: ""
      type: path
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: http://localhost:8080/oauth2/token
    refreshTokenUrl: http://localhost:8080/oauth2/refresh-token
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: message.read message.write
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "http://localhost:{{gateway-port}}/api/v2/beer/:beerId"
      method: DELETE
      params:
        - name: beerId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
